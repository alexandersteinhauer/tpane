[workspace]
members = [".", "crates/tpane-core"]
resolver = "3"

[package]
name = "tpane"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A minimal terminal multiplexer powered by Ghostty"
publish = false

[dependencies]
anyhow = "1.0"
# Level-triggered polling preserves input readiness when a resize arrives simultaneously.
crossterm = { version = "0.29", features = ["use-dev-tty", "event-stream"] }
futures-util = "=0.3.34"
libc = "0.2"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "sync", "time", "net", "macros", "signal", "process", "io-util"] }
tokio-util = { version = "=0.7.20", features = ["time"] }
tpane-core = { path = "crates/tpane-core" }
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.2"

[dev-dependencies]
portable-pty = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
