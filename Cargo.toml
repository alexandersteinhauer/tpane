[package]
name = "tpane"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A minimal terminal multiplexer powered by Ghostty"
publish = false

[dependencies]
anyhow = "1.0"
# Level-triggered polling preserves input readiness when a resize arrives simultaneously.
crossterm = { version = "0.29", features = ["use-dev-tty", "event-stream"] }
futures-util = "=0.3.34"
libc = "0.2"
libghostty-vt = { version = "=0.2.1", default-features = false }
portable-pty = "0.9"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "sync", "time", "net", "macros", "signal", "process", "io-util"] }
tokio-util = { version = "=0.7.19", features = ["time"] }

[profile.release]
lto = "thin"
codegen-units = 1
